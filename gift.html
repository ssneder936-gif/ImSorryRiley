<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A little something for you</title>
<style>
:root{--bg:#f6e6ea;--text:#3a2a30;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1418;--text:#f6e8ec}}
:root[data-theme="dark"]{--bg:#1c1418;--text:#f6e8ec}
html{height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 30%,var(--bg),#00000018 140%),var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px 40px;overflow-x:hidden}
.hint{font-size:1.5rem;font-weight:800;margin-bottom:18px;animation:pulse 1.4s ease-in-out infinite;text-align:center}
@keyframes pulse{50%{transform:scale(1.08)}}
.stage{width:240px;height:260px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.stage svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.stage:not(.open) svg{animation:wiggle 2.4s ease-in-out infinite;transform-origin:50% 95%}
@keyframes wiggle{0%,78%,100%{transform:rotate(0)}83%{transform:rotate(-3deg)}88%{transform:rotate(3deg)}93%{transform:rotate(-2deg)}}
.lid,.bow{transition:transform .8s cubic-bezier(.3,1.3,.5,1),opacity .8s;transform-box:fill-box;transform-origin:center}
.stage.open .lid{transform:translate(-130px,-170px) rotate(-35deg);opacity:0}
.stage.open .bow{transform:translate(130px,-200px) rotate(30deg);opacity:0}
.stage.open svg{animation:none}
.stage.gone{display:none}

.reveal{display:none;width:100%;max-width:380px}
.reveal.show{display:block;animation:rise .9s cubic-bezier(.2,1.2,.4,1) both}
@keyframes rise{from{opacity:0;transform:translateY(120px) scale(.7) rotate(4deg)}}
.paper{position:relative;background:#fffdf3;color:#2f2a33;border-radius:3px;padding:26px 22px 24px 46px;box-shadow:0 1px 1px rgba(0,0,0,.2),0 10px 30px rgba(0,0,0,.28),0 2px 0 #f0ead6;transform:rotate(-1.2deg);
background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#cfe0ee 31px,#cfe0ee 32px);background-position:0 8px}
.paper::before{content:"";position:absolute;left:36px;top:0;bottom:0;width:2px;background:#f2a1a8}
.paper::after{content:"";position:absolute;left:10px;top:30px;width:12px;height:12px;border-radius:50%;background:var(--bg);box-shadow:0 70px 0 var(--bg),0 140px 0 var(--bg),inset 0 1px 3px rgba(0,0,0,.4)}
.hand{font-family:"Segoe Print","Bradley Hand","Noteworthy","Marker Felt","Comic Sans MS",cursive}
h2.hand{margin:0 0 14px;font-size:2.1rem;line-height:32px;color:#2a4fa8}
.paper p.hand{margin:0;font-size:1.2rem;line-height:32px;color:#2a4fa8}
.q{margin-top:32px}
.opts{display:flex;gap:28px;margin-top:8px}
.opt{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:4px 0;font:inherit;color:#2a4fa8;font-size:1.3rem;-webkit-tap-highlight-color:transparent}
.box{width:34px;height:34px;border:3px solid #2a4fa8;border-radius:5px;background:#fffef8;display:flex;align-items:center;justify-content:center;font-size:1.7rem;line-height:1;font-weight:800;transition:transform .15s}
.opt:active .box{transform:scale(.9)}
.box.yes.on{color:#1f9d55;animation:stamp .35s}
.box.no.on{color:#d1303c;animation:stamp .35s}
@keyframes stamp{from{transform:scale(2);opacity:0}}
.thanks{display:none;margin-top:6px;font-size:1.5rem;color:#1f9d55;line-height:32px}
.thanks.show{display:block;animation:rise2 .5s both}
@keyframes rise2{from{opacity:0;transform:translateY(10px)}}
.giftcard{margin:26px 0 0 -6px;aspect-ratio:1.62;border-radius:14px;background:linear-gradient(135deg,#1a1a2e 0%,#3b2a6e 50%,#8e2de2 100%);color:#fff;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 18px rgba(40,20,90,.45),inset 0 0 0 1px rgba(255,255,255,.18);transform:rotate(1.2deg);position:relative;overflow:hidden;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.giftcard::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.16) 48%,transparent 60%);animation:shine 4s ease-in-out infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.gc-top{display:flex;justify-content:space-between;align-items:flex-start}
.gc-brand{font-size:1.55rem;font-weight:900;letter-spacing:.5px}
.gc-tag{font-size:.7rem;letter-spacing:2.5px;text-transform:uppercase;opacity:.85;margin-top:4px}
.chip{width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#f5d77a,#c79a2b);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.gc-amt{font-size:2.7rem;font-weight:900;line-height:1}
.gc-for{font-size:.95rem;font-weight:600;opacity:.95;margin-top:2px}
.gc-num{font-size:.8rem;letter-spacing:2.5px;opacity:.75}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.overlay.show{display:flex}
.pop{background:#fffdf3;color:#2f2a33;border-radius:18px;padding:28px 22px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:boom .45s cubic-bezier(.3,1.5,.5,1) both}
@keyframes boom{from{transform:scale(.3) rotate(-10deg);opacity:0}}
.pop .big{font-size:5.5rem;line-height:1;animation:shake .6s .3s}
@keyframes shake{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.pop p{font-size:1.25rem;font-weight:700;line-height:1.4;margin:14px 0 18px}
.pop button{font:inherit;font-weight:700;font-size:1rem;border:0;border-radius:999px;background:#2a4fa8;color:#fff;padding:10px 22px;cursor:pointer}
.confetti{position:fixed;top:-14px;width:10px;height:14px;pointer-events:none;z-index:9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="hint" id="hint">Click me! 🎁</div>

<div class="stage" id="stage" role="button" tabindex="0" aria-label="Open the gift">
<svg viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="red" x1="0" x2="1"><stop offset="0" stop-color="#d63553"/><stop offset=".6" stop-color="#e84863"/><stop offset="1" stop-color="#a81f3b"/></linearGradient>
    <linearGradient id="redLid" x1="0" x2="1"><stop offset="0" stop-color="#e0405c"/><stop offset=".55" stop-color="#f0576f"/><stop offset="1" stop-color="#b52745"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#e5b53a"/><stop offset=".5" stop-color="#ffe27a"/><stop offset="1" stop-color="#d09a22"/></linearGradient>
    <linearGradient id="goldv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe888"/><stop offset="1" stop-color="#c8921d"/></linearGradient>
    <linearGradient id="under" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
    <linearGradient id="side" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient>
    <radialGradient id="knot" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff0a0"/><stop offset="1" stop-color="#c8921d"/></radialGradient>
  </defs>
  <ellipse cx="120" cy="250" rx="108" ry="9" fill="rgba(0,0,0,.28)"/>
  <!-- body -->
  <rect x="22" y="104" width="196" height="140" rx="4" fill="url(#red)"/>
  <rect x="22" y="104" width="196" height="140" rx="4" fill="url(#side)"/>
  <rect x="98" y="104" width="44" height="140" fill="url(#gold)"/>
  <rect x="98" y="104" width="44" height="140" fill="url(#side)" opacity=".6"/>
  <rect x="22" y="104" width="196" height="26" fill="url(#under)"/>
  <rect x="22" y="236" width="196" height="8" rx="3" fill="#000" opacity=".12"/>
  <!-- lid -->
  <g class="lid">
    <rect x="12" y="72" width="216" height="46" rx="5" fill="url(#redLid)"/>
    <rect x="12" y="72" width="216" height="46" rx="5" fill="url(#side)"/>
    <rect x="96" y="72" width="48" height="46" fill="url(#gold)"/>
    <rect x="12" y="72" width="216" height="6" rx="3" fill="#fff" opacity=".3"/>
    <rect x="12" y="112" width="216" height="6" rx="3" fill="#000" opacity=".18"/>
  </g>
  <!-- bow -->
  <g class="bow">
    <path d="M120 72 C100 74 96 80 92 80 L100 96 L120 78 Z" fill="url(#goldv)" opacity="0"/>
    <path d="M112 66 L84 96 L100 100 L120 72 Z" fill="#c8921d"/>
    <path d="M128 66 L156 96 L140 100 L120 72 Z" fill="#b98318"/>
    <path d="M118 70 C96 66 62 30 52 44 C42 60 62 74 90 74 C102 74 112 72 118 70 Z" fill="url(#goldv)"/>
    <path d="M118 70 C100 62 74 40 64 48 C60 56 76 68 100 71 Z" fill="#a8741a" opacity=".45"/>
    <path d="M122 70 C144 66 178 30 188 44 C198 60 178 74 150 74 C138 74 128 72 122 70 Z" fill="url(#goldv)"/>
    <path d="M122 70 C140 62 166 40 176 48 C180 56 164 68 140 71 Z" fill="#a8741a" opacity=".45"/>
    <ellipse cx="120" cy="72" rx="13" ry="11" fill="url(#knot)"/>
  </g>
</svg>
</div>

<div class="reveal" id="reveal">
  <div class="paper">
    <h2 class="hand">I’m sorry</h2>
    <p class="hand">I hope your grandpa gets better.</p>

    <div class="q">
      <p class="hand">Do you accept my apology?</p>
      <div class="opts">
        <button class="opt hand" id="yes"><span class="box yes" id="yesBox"></span>Yes</button>
        <button class="opt hand" id="no"><span class="box no" id="noBox"></span>No</button>
      </div>
      <div class="thanks hand" id="thanks">Thank you 💛</div>
    </div>

    <div class="giftcard">
      <div class="gc-top">
        <div><div class="gc-brand">Spencer’s</div><div class="gc-tag">Gift card</div></div>
        <div class="chip"></div>
      </div>
      <div>
        <div class="gc-amt">$20</div>
        <div class="gc-for">for the back of Spencer’s</div>
      </div>
      <div class="gc-num">•••• •••• •••• 0020</div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="pop">
    <div class="big">🖕</div>
    <p>I hope your grandpa gets better but fuck you</p>
    <button id="again">Let me reconsider</button>
  </div>
</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var stage=$('stage'),reveal=$('reveal'),hint=$('hint'),opened=false;
  function confetti(){
    var colors=['#ffd45e','#e63d5c','#6a4cff','#4cc9a0','#ff8a4c'];
    for(var i=0;i<60;i++){
      var c=document.createElement('div');
      c.className='confetti';
      c.style.left=Math.random()*100+'vw';
      c.style.background=colors[i%colors.length];
      c.style.animationDuration=(2+Math.random()*2)+'s';
      c.style.animationDelay=(Math.random()*.6)+'s';
      document.body.appendChild(c);
      (function(el){setTimeout(function(){el.remove()},5000)})(c);
    }
  }
  function open(){
    if(opened)return;
    opened=true;
    stage.classList.add('open');
    hint.style.display='none';
    setTimeout(function(){
      stage.classList.add('gone');
      reveal.classList.add('show');
      confetti();
    },800);
  }
  stage.addEventListener('click',open);
  stage.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});

  var yesBox=$('yesBox'),noBox=$('noBox'),thanks=$('thanks'),overlay=$('overlay');
  function clear(){
    yesBox.textContent='';yesBox.classList.remove('on');
    noBox.textContent='';noBox.classList.remove('on');
    thanks.classList.remove('show');
  }
  $('yes').addEventListener('click',function(){
    clear();
    yesBox.textContent='✔';yesBox.classList.add('on');
    thanks.classList.add('show');
    confetti();
  });
  $('no').addEventListener('click',function(){
    clear();
    noBox.textContent='✘';noBox.classList.add('on');
    setTimeout(function(){overlay.classList.add('show')},450);
  });
  $('again').addEventListener('click',function(){
    overlay.classList.remove('show');
    clear();
  });
})();
</script>
</body>
</html>
